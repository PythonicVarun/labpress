name: Publish

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            dist-tag:
                description: "npm dist-tag to publish under"
                default: latest
                required: false

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - run: npm install -g npm@latest

            - run: npm install --no-audit --no-fund

            - name: Check the tag matches package.json
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  tagged="${GITHUB_REF_NAME#v}"
                  declared="$(node -p "require('./package.json').version")"
                  if [ "$tagged" != "$declared" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package.json version $declared" >&2
                      exit 1
                  fi

            - name: Smoke test the packed tarball
              run: |
                  tarball="$(npm pack --silent)"
                  mkdir -p /tmp/smoke && cd /tmp/smoke
                  npm init -y >/dev/null
                  npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$tarball"
                  ./node_modules/.bin/labpress --version
                  ./node_modules/.bin/labpress themes >/dev/null
                  printf 'print("hi from labpress")\n' > hello.py
                  ./node_modules/.bin/labpress . --no-open --out record.html
                  grep -q "hi from labpress" record.html

            # Staged, not published
            - name: Stage the release on npm
              run: npm stage publish --provenance --access public --tag "${{ inputs.dist-tag || 'latest' }}"

            - name: Say how to approve it
              run: |
                  {
                      echo "### Staged, waiting for approval"
                      echo
                      echo "Nothing is installable yet. To finish the release:"
                      echo
                      echo '```bash'
                      echo "npm stage list labpress          # find the stage id"
                      echo "npm stage download <stage-id>    # check the tarball"
                      echo "npm stage approve <stage-id>     # publish it"
                      echo '```'
                      echo
                      echo "Changed your mind? \`npm stage reject <stage-id>\`."
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Create the GitHub release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
